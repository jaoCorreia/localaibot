
[program:cua-driver]
command=/home/cua/.local/bin/cua-driver serve
user=cua
environment=HOME="/home/cua",USER="cua",DISPLAY=":1"
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/cua-driver.log
stderr_logfile=/var/log/supervisor/cua-driver.error.log
priority=30

[program:localbot-agent]
command=/usr/bin/node /opt/localbot/agent.mjs
user=cua
environment=HOME="/home/cua",USER="cua",DISPLAY=":1"
autorestart=true
startsecs=2
; To the container's output, so `docker logs` and Railway's logs show the share code.
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=40
