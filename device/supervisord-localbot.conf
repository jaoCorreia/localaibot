
[program:cua-driver]
command=/home/cua/.local/bin/cua-driver serve
user=cua
environment=HOME="/home/cua",USER="cua",DISPLAY=":1"
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/cua-driver.log
stderr_logfile=/var/log/supervisor/cua-driver.error.log
priority=30

[program:localbot-agent]
command=/usr/bin/node /opt/localbot/agent.mjs
user=cua
environment=HOME="/home/cua",USER="cua",DISPLAY=":1"
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/localbot-agent.log
stderr_logfile=/var/log/supervisor/localbot-agent.error.log
priority=40
